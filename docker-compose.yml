version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyber-academy-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: cyber_academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-academy-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres_pass@db:5432/cyber_academy?schema=public
      JWT_SECRET: academy_sec_9812
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000
    container_name: cyber-academy-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
